<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Host · Cloud Media Live Quiz</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="host.css">
</head>
<body class="host">
<div id="login" class="login" hidden>
  <form id="loginForm" class="card">
    <h1>Host sign in</h1>
    <p class="muted">Type the host password.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Host password">
    <p class="err" id="loginErr"></p>
    <button class="btn big">Sign in</button>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <header class="htop">
    <div class="brand"><span class="dot"></span>Cloud Media Academy <span class="muted">Live Quiz</span></div>
    <div id="where" class="where"></div>
    <div class="topbtns">
      <span id="conn" class="conn" title="Connection to the server"></span>
      <button class="tbtn" id="bGames">Games</button>
      <button class="tbtn" id="bChamp">Champion</button>
      <button class="tbtn" id="bFull">Full screen</button>
    </div>
  </header>
  <main id="stage" class="stage"></main>
  <footer class="controls">
    <div class="left">
      <button class="cbtn" id="cEnd">End game</button>
      <button class="cbtn" id="cCsv">Download CSV</button>
    </div>
    <div class="right">
      <button class="cbtn" id="cPair">+ Another pair</button>
      <button class="cbtn" id="cTime10">+10 sec</button>
      <button class="cbtn" id="cTime60">+1 min</button>
      <button class="cbtn" id="cSkip">Skip</button>
      <button class="cbtn primary" id="cNext">Next</button>
    </div>
  </footer>
</div>
<script src="sio.js"></script>
<script src="shared.js"></script>
<script src="host.js"></script>
</body>
</html>
